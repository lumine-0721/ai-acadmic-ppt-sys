[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-evidence-asset-acquisition"
version = "1.0.0"
description = "Package for the scientific evidence and asset acquisition tools."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
scientific-evidence-asset-acquisition = "seaa_pkg_cli:main"

[tool.setuptools]
py-modules = ["seaa_pkg_cli"]
