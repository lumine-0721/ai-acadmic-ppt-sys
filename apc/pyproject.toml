[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-presentation-compiler"
version = "1.0.0"
description = "Package for the installed academic presentation compiler."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
academic-presentation-compiler = "apc_cli:main"

[tool.setuptools]
py-modules = ["apc_cli"]
