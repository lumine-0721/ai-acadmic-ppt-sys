[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptv01"
version = "0.1.0.dev0"
description = "AI PPT Sys V0.1: one utterance -> inspectable PPTX via a short linear production chain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5,<3",
  "python-pptx>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# relevance filter scorer (optional; without it the filter runs structural-only and records that)
rank = ["fastembed>=0.3"]
# opt-in cross-encoder reranker (needs torch; ~2.2 GB model; NOT the default, see docs/relevance-benchmark.md)
rerank = ["sentence-transformers>=3", "torch"]

[project.scripts]
pptv01 = "pptv01.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]
